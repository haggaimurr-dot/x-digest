<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="X 博主推文日报 — 时间线风格摘要" />
  <title>我的复刻 · 推文日报</title>
  <!-- Ensure trailing slash so relative CSS/JS/JSON resolve under /x-digest/ -->
  <script>
    (function () {
      var p = location.pathname;
      if (!p.endsWith("/") && !/\.html?$/i.test(p)) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
  <!-- Critical CSS: dark canvas even before stylesheet loads -->
  <style>
    html, body {
      margin: 0;
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .boot-error { color: #f4212e; }
  </style>
  <link rel="stylesheet" href="./styles.css?v=47" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e7e9ea' d='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="topbar-inner">
      <a class="logo" href="./">← 推文日报</a>
      <a class="text-btn" href="./fuke.html" aria-current="page">我的复刻</a>
    </div></header>
    <main class="feed-col replicas-col" id="replicasPage">
      <div class="page-title">
        <h1>我的复刻</h1>
        <p class="updated">把帖子里的流程复刻到这里，记录状态、备注与阶段附件</p>
      </div>
      <div class="replicas-toolbar">
        <span id="replicaCount" class="result-count">0 条复刻</span>
        <label class="replicas-sort">
          <span class="filter-field-label">排序</span>
          <select id="replicaSort" class="field replica-sort-select">
            <option value="time">按复刻时间</option>
            <option value="progress">按完成进度</option>
          </select>
        </label>
      </div>
      <p class="status-legend">状态圆点：灰色 未开始 · 红色呼吸 进行中 · 绿色 已完成（点击循环切换）</p>
      <section class="replica-list" id="replicaList" aria-label="复刻列表"></section>
      <p class="empty" id="replicaEmpty" hidden>还没有复刻任何流程，去帖子里找一个带流程图的教程点「复刻」试试。<a href="./">返回帖子流</a></p>
    </main>
  </div>
  <dialog class="modal confirm-modal" id="confirmModal" aria-labelledby="confirmTitle" aria-describedby="confirmBody">
    <form method="dialog" class="modal-card confirm-card">
      <h2 class="confirm-title" id="confirmTitle"></h2>
      <p class="confirm-body" id="confirmBody"></p>
      <div class="confirm-actions">
        <button type="submit" class="btn-secondary" id="confirmCancel" value="cancel">取消</button>
        <button type="submit" class="btn-danger" value="ok">删除</button>
      </div>
    </form>
  </dialog>

  <dialog class="modal attachment-preview" id="attachmentPreview" aria-labelledby="attachmentPreviewTitle">
    <div class="attachment-preview-head"><h2 id="attachmentPreviewTitle"></h2><button type="button" id="attachmentPreviewClose" aria-label="关闭预览">关闭</button></div>
    <div id="attachmentPreviewBody"></div>
  </dialog>
  <script src="./flow.js?v=47" defer></script>
  <script src="./fuke-preview.js?v=47" defer></script>
  <script src="./fuke.js?v=47" defer></script>
</body></html>

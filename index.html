<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="X 博主推文日报 — 时间线风格摘要" />
  <title>X 博主推文日报</title>
  <!-- Ensure trailing slash so relative CSS/JS/JSON resolve under /x-digest/ -->
  <script>
    (function () {
      var p = location.pathname;
      if (!p.endsWith("/") && !/\.html?$/i.test(p)) {
        location.replace(p + "/" + location.search + location.hash);
      }
    })();
  </script>
  <!-- Critical CSS: dark canvas even before stylesheet loads -->
  <style>
    html, body {
      margin: 0;
      background: #000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .boot-error { color: #f4212e; }
  </style>
  <link rel="stylesheet" href="./styles.css?v=9" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23e7e9ea' d='M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="logo" href="./" aria-label="首页">
          <svg class="logo-x" viewBox="0 0 24 24" aria-hidden="true" width="20" height="20">
            <path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <span class="logo-text">推文日报</span>
        </a>
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.176 5.262l4.781 4.781a.75.75 0 1 1-1.06 1.06l-4.781-4.781A8.5 8.5 0 0 1 1.75 10.25z"/>
          </svg>
          <input type="search" id="keyword" class="search-input" placeholder="搜索标题、简介、行业、技术…" autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button type="button" class="icon-btn" id="themeToggle" aria-label="切换主题" title="切换深色/浅色">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2.25a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75zm0 15a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5a.75.75 0 0 1 .75-.75zM4.72 4.72a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06L4.72 5.78a.75.75 0 0 1 0-1.06zm12.44 12.44a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06zM2.25 12a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5H3a.75.75 0 0 1-.75-.75zm15 0a.75.75 0 0 1 .75-.75h1.5a.75.75 0 0 1 0 1.5H18a.75.75 0 0 1-.75-.75zM4.72 19.28a.75.75 0 0 1 0-1.06l1.06-1.06a.75.75 0 1 1 1.06 1.06L5.78 19.28a.75.75 0 0 1-1.06 0zm12.44-12.44a.75.75 0 0 1 0-1.06l1.06-1.06a.75.75 0 1 1 1.06 1.06l-1.06 1.06a.75.75 0 0 1-1.06 0zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="openSettings" aria-label="设置" aria-haspopup="dialog" title="关注列表设置">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10.5 5.5a1.5 1.5 0 1 1 3 0v.34c.76.18 1.47.5 2.1.94l.24-.24a1.5 1.5 0 1 1 2.12 2.12l-.24.24c.44.63.76 1.34.94 2.1h.34a1.5 1.5 0 1 1 0 3h-.34a6.47 6.47 0 0 1-.94 2.1l.24.24a1.5 1.5 0 1 1-2.12 2.12l-.24-.24a6.47 6.47 0 0 1-2.1.94v.34a1.5 1.5 0 1 1-3 0v-.34a6.47 6.47 0 0 1-2.1-.94l-.24.24a1.5 1.5 0 1 1-2.12-2.12l.24-.24a6.47 6.47 0 0 1-.94-2.1H5.5a1.5 1.5 0 1 1 0-3h.34c.18-.76.5-1.47.94-2.1l-.24-.24A1.5 1.5 0 1 1 8.66 6.54l.24.24c.63-.44 1.34-.76 2.1-.94V5.5zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="feed-col">
      <div class="page-title">
        <h1>X 博主推文日报</h1>
        <p class="updated" id="lastUpdated">加载中…</p>
      </div>

      <section class="filter-bar is-collapsed" id="filterBar" aria-label="筛选">
        <div class="filter-compact">
          <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">
            <span class="filter-chevron" aria-hidden="true">▸</span>
            <span>筛选</span>
          </button>
          <span id="resultCount" class="result-count">0 条推文</span>
          <span class="filter-compact-right">
            <span id="activeFilterCount" class="active-count" hidden>0 个筛选条件</span>
            <button type="button" class="text-btn" id="clearFilters">清除全部</button>
          </span>
        </div>
        <div class="filter-panel" id="filterPanel" hidden>
          <div class="filter-row">
            <label class="filter-field">
              <span class="filter-field-label">时间区间</span>
              <span class="date-range">
                <input type="date" id="dateFrom" class="filter-input" aria-label="开始日期" />
                <span class="date-sep">至</span>
                <input type="date" id="dateTo" class="filter-input" aria-label="结束日期" />
              </span>
            </label>
            <label class="filter-field grow">
              <span class="filter-field-label">用户名称</span>
              <input type="search" id="userFilter" class="filter-input" placeholder="显示名或 @username" autocomplete="off" />
            </label>
          </div>
          <div class="filter-row">
            <label class="filter-field grow">
              <span class="filter-field-label">标签检索</span>
              <input type="search" id="tagFilter" class="filter-input" placeholder="输入标签关键词…" autocomplete="off" />
            </label>
          </div>
          <div class="filter-section-label">作者</div>
          <div class="chips-scroll" id="authorChips" role="group" aria-label="按作者筛选"></div>
          <div class="filter-section-label">标签</div>
          <div class="chips-scroll" id="tagChips" role="group" aria-label="按标签筛选"></div>
        </div>
      </section>

      <section class="timeline" id="timeline" aria-label="推文时间线"></section>
      <p class="empty" id="emptyState" hidden>没有匹配的推文，试试调整筛选条件。</p>
    </main>
  </div>

  <dialog class="modal" id="settingsModal">
    <div class="modal-card">
      <header class="modal-header">
        <h2>关注列表</h2>
        <button type="button" class="icon-btn" id="closeSettings" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M10.59 12 4.54 5.96a1 1 0 1 1 1.42-1.42L12 10.59l6.04-6.05a1 1 0 1 1 1.42 1.42L13.41 12l6.05 6.04a1 1 0 0 1-1.42 1.42L12 13.41l-6.04 6.05a1 1 0 0 1-1.42-1.42L10.59 12z"/></svg>
        </button>
      </header>
      <div class="modal-body">
        <p class="hint">本机写入 localStorage；仓库 <code>config/watchlist.json</code> 是每日更新的权威来源。</p>
        <ul class="watch-list" id="watchList"></ul>
        <div class="add-row">
          <input type="text" id="newUsername" class="field" placeholder="用户名，如 ai_xiaomu" maxlength="15" />
          <input type="text" id="newDisplayName" class="field" placeholder="显示名（可选）" maxlength="40" />
          <button type="button" class="btn-accent" id="addAuthor">添加</button>
        </div>
      </div>
      <footer class="modal-footer">
        <button type="button" class="text-btn" id="resetWatchlist">恢复默认</button>
        <button type="button" class="btn-accent" id="doneSettings">完成</button>
      </footer>
    </div>
  </dialog>

  <script src="./app.js?v=9" defer></script>
</body>
</html>
